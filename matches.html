    '<span class="ctrack"><i style="flex:'+a+';background:'+CA+'"></i><i style="flex:'+b+';background:'+CB+'"></i></span>'+
    '<span class="cvb" style="color:'+TB+'"><span class="cpct">'+(100-pa)+'%</span> '+k(b)+'</span></div>';
}
// 一对局五路对位：每路一块（A选手/位置/B选手 + 富数据局三条对比条），中立无主视角
function laneBlocks(rows){
  var L={},R={};
  rows.forEach(function(r){(r.side==='left'?L:R)[r['位置']]=r;});
  return POS.map(function(p){
    var a=L[p],b=R[p];
    function who(r,cls){ if(!r)return '<div class="dpp '+cls+' dim">—</div>';
      return '<div class="dpp '+cls+'"><div class="dpn"><b>'+esc(r['姓名'])+'</b> '+esc(r['使用英雄'])+
        (r['mvp']?' <span style="color:#F1D98F">★</span>':'')+'</div>'+
        '<div class="dpk">'+f1(r['分值'])+' · '+r['击杀']+'/'+r['死亡']+'/'+r['助攻']+'</div></div>'; }
    var head='<div class="dphd">'+who(a,'dpA')+'<div class="dpc">'+p+'</div>'+who(b,'dpB')+'</div>';
    var bars='';
    if(a&&b&&(a['对英雄伤害']||b['对英雄伤害']))
      bars='<div class="dpbars">'+cbar('伤害',a['对英雄伤害'],b['对英雄伤害'])+
        cbar('承伤',a['承受伤害'],b['承受伤害'])+cbar('经济',a['经济'],b['经济'])+'</div>';
    return '<div class="dpos">'+head+bars+'</div>';
  }).join('');
}
var BANS=MX.bans||{}, BANS2=MX.bans_side||{};
function banChips(arr){ return arr.map(function(c){return '<span class="gbc">'+esc(c)+'</span>';}).join(''); }
function banGrp(label,color,arr){ return '<div class="gbgrp"><span class="gbl"'+(color?' style="color:'+color+'"':'')+'>'+label+'</span>'+banChips(arr)+'</div>'; }
function banRow(gid){
  var sd=BANS2[gid];
  if(sd&&(sd.left.length||sd.right.length)){   // 左右拆分（近期征召局）：A组/B组各一整组
    var h='<div class="gbans">';
    if(sd.left.length)  h+=banGrp('A组禁',TA,sd.left);
    if(sd.right.length) h+=banGrp('B组禁',TB,sd.right);
    return h+'</div>';
  }
  var b=BANS[gid]||[];   // 旧局只存了合并名单 -> 回退合并显示(单组)
  if(!b.length) return '';
  return '<div class="gbans">'+banGrp('禁用','',b)+'</div>';
}
function detail(d){
  var games=byDate[d], gids=Object.keys(games).sort(function(a,b){
    return (+a.split('-')[1])-(+b.split('-')[1]);});
  return gids.map(function(gid){
    var rows=games[gid], n=gid.split('-')[1];
    var aw=side(rows,'left').some(function(r){return r['小场赢'];});
    var dur=rows[0]&&rows[0]['对局时长']?(' · 时长 '+mmss(rows[0]['对局时长'])):'';
    var res=' · <b style="color:'+(aw?TA:TB)+'">'+(aw?'A组胜':'B组胜')+'</b>';
    return '<div class="gsec">第 '+n+' 局'+dur+res+'</div>'+banRow(gid)+laneBlocks(rows);
  }).join('');
}
var wrap=document.getElementById('mxList');
wrap.innerHTML=dates.map(function(d){
  var games=byDate[d], gids=Object.keys(games);
  var first=games[gids.sort(function(a,b){return (+a.split('-')[1])-(+b.split('-')[1]);})[0]];
  var A=byAsOf(side(first,'left'),d), B=byAsOf(side(first,'right'),d);
  var aw=0; gids.forEach(function(g){ if(side(games[g],'left').some(function(r){return r['小场赢'];}))aw++; });
  var bw=gids.length-aw;
  var allL=[],allR=[]; gids.forEach(function(g){allL=allL.concat(side(games[g],'left'));allR=allR.concat(side(games[g],'right'));});
  var aAvg=avg(allL), bAvg=avg(allR);
  var rich=G.some(function(r){return r['比赛场次'].split('-')[0]===d&&r['对英雄伤害'];});
  var ver=(MX.cnpatch||{})[d]||'';   // 比赛日所跑版本(查日历,全球统一 16.x)
  function roster(rows,win,score,a){
    return '<div class="mteam'+(win?' win':'')+'"><span class="ms">'+(a?'A组':'B组')+' '+score+'</span>'+
      '<span class="mavg">队均分 '+f1(a?aAvg:bAvg)+'</span>'+
      '<span class="mr">'+rows.map(function(r){return esc(r['姓名']);}).join(' · ')+'</span></div>';
  }
  return '<div class="mcard" data-d="'+d+'">'+
    '<div class="mhd"><span class="mdt">'+dlabel(d)+'</span>'+
      '<span class="msc">A <b>'+aw+':'+bw+'</b> B</span>'+
      (ver?'<span class="vbadge">S'+ver+'</span>':'')+
      (rich?'<span class="rbadge">详细数据</span>':'')+
      '<span class="mtoggle">展开 ▾</span></div>'+
    roster(A,aw>bw,aw+'胜',true)+roster(B,bw>aw,bw+'胜',false)+
    '<div class="mdetail" style="display:none"></div></div>';
}).join('');
wrap.querySelectorAll('.mcard').forEach(function(c){
  var hd=c.querySelector('.mhd'), dt=c.querySelector('.mdetail'), tg=c.querySelector('.mtoggle');
  hd.onclick=function(){
    var open=dt.style.display!=='none';
    if(open){dt.style.display='none';tg.textContent='展开 ▾';}
    else{ if(!dt.innerHTML)dt.innerHTML=detail(c.dataset.d); dt.style.display='';tg.textContent='收起 ▴';}
  };
});

/* ---- 全部对局：逐对局明细平铺表（位置/比赛/关键字筛选 + 列头排序），从同一 games payload ---- */
var NAMES=MX.names||[];
var HASP={}; NAMES.forEach(function(n){HASP[n]=1;});
var POSC={'打野':'#11C5D9','上单':'#9B5CFF','中单':'#FF4D57','下路':'#F59E0B','辅助':'#22C55E'};
function pct(x){ return x==null?'–':Math.round(x*100)+'%'; }
function wan(x){ return x==null?'–':(x>=10000?(x/10000).toFixed(1)+'万':x.toLocaleString()); }
function gname(s){ var m=/^(\d{4})(\d\d)(\d\d)-(\d+)$/.exec(s||''); return m?m[2]+'-'+m[3]+' 第'+m[4]+'局':s; }
function posChip(p){ var c=POSC[p]||'#7FA0BA'; return '<span class="pos" style="color:'+c+';border:1px solid '+c+'55;background:'+c+'14">'+esc(p)+'</span>'; }
var GC=[
  {l:'对局',left:1,v:function(r){return r['比赛场次'];},h:function(r){return '<span class="dim">'+gname(r['比赛场次'])+'</span>';}},
  {l:'选手',left:1,nosort:1,v:function(r){return r['姓名'];},h:function(r){
    return HASP[r['姓名']]?'<a class="nm" href="player-'+encodeURIComponent(r['姓名'])+'">'+esc(r['姓名'])+'</a>'
                          :'<span class="nm">'+esc(r['姓名'])+'</span>';}},
  {l:'位置',left:1,nosort:1,v:function(r){return r['位置'];},h:function(r){return posChip(r['位置']);}},
  {l:'英雄',left:1,nosort:1,v:function(r){return r['使用英雄'];},h:function(r){return esc(r['使用英雄']||'–');}},
  {l:'分值',v:function(r){return r['分值'];},h:function(r){return '<b>'+(r['分值']==null?'–':r['分值'].toFixed(1))+'</b>';}},
  {l:'K/D/A',v:function(r){return r['kda'];},h:function(r){return r['击杀']+' / '+r['死亡']+' / '+r['助攻'];}},
  {l:'KDA',v:function(r){return r['kda'];},h:function(r){return r['kda']==null?'–':r['kda'].toFixed(2);}},
  {l:'胜负',v:function(r){return r['小场赢'];},h:function(r){return r['小场赢']?'<span class="win">胜</span>':'<span class="lose">负</span>';}},
  {l:'MVP',v:function(r){return r['mvp']||0;},h:function(r){return r['mvp']?'<span class="gold">★</span>':'';}},
  {l:'输出伤害',v:function(r){return r['对英雄伤害'];},h:function(r){return wan(r['对英雄伤害']);}},
  {l:'经济',v:function(r){return r['经济'];},h:function(r){return wan(r['经济']);}},
  {l:'输出占比',v:function(r){return r['输出占比'];},h:function(r){return pct(r['输出占比']);}},
  {l:'参团率',v:function(r){return r['击杀参与率'];},h:function(r){return pct(r['击杀参与率']);}},
  {l:'对位输出差',v:function(r){return r['对位输出差'];},h:function(r){var x=r['对位输出差'];
    return x==null?'–':'<span class="'+(x>=0?'up':'dn')+'">'+(x>=0?'+':'')+wan(Math.round(x))+'</span>';}},
  {l:'时长',v:function(r){return r['对局时长'];},h:function(r){return r['对局时长']==null?'–':Math.round(r['对局时长'])+'分';}}
];
var fpos='',fmatch='',fq='',fsK=null,fsD=-1;
var mxth=document.getElementById('mxth'),mxtb=document.getElementById('mxtb'),mxnote=document.getElementById('mxnote');
function frows(){ return G.filter(function(r){
  if(fpos&&r['位置']!==fpos) return false;
  if(fmatch&&r['比赛场次'].indexOf(fmatch)!==0) return false;
  if(fq&&(r['姓名']+''+(r['使用英雄']||'')).indexOf(fq)<0) return false;
  return true;}); }
function frender(){
  var a=frows(), k=fsK==null?0:fsK, d=fsK==null?-1:fsD;
  if(k>0){ a=a.slice().sort(function(x,y){var vx=GC[k].v(x),vy=GC[k].v(y);
    if(vx==null)vx=-Infinity; if(vy==null)vy=-Infinity;
    if(typeof vx==='string'||typeof vy==='string')return d*String(vx).localeCompare(String(vy),'zh');
    return d*(vx-vy);}); }
  else { a=a.slice().sort(function(x,y){return y['比赛场次'].localeCompare(x['比赛场次']);}); }   // 默认最新在前
  mxth.innerHTML='<tr>'+GC.map(function(c,i){
    var srt=!c.nosort;
    return '<th class="'+(c.left?'l':'')+(srt?' srt':'')+(i===k?' on':'')+'" data-i="'+i+'">'+c.l+(srt?'<span class="sarr">'+(i===k?(d>0?'▲':'▼'):'⇅')+'</span>':'')+'</th>';}).join('')+'</tr>';
  mxtb.innerHTML=a.map(function(r){
    return '<tr>'+GC.map(function(c){return '<td class="'+(c.left?'l':'')+'">'+c.h(r)+'</td>';}).join('')+'</tr>';}).join('');
  mxnote.textContent='共 '+a.length+' 条逐局记录；伤害/经济等详细数据仅部分比赛有。点列头排序。';
  mxth.querySelectorAll('th').forEach(function(el){ el.onclick=function(){
    var i=+el.dataset.i; if(GC[i].nosort)return; if(fsK===i){fsD=-fsD;}else{fsK=i;fsD=-1;} frender(); };});
}
document.getElementById('mxPos').querySelectorAll('button').forEach(function(b){ b.onclick=function(){
  fpos=b.dataset.p===fpos?'':b.dataset.p;
  document.querySelectorAll('#mxPos button').forEach(function(x){x.classList.toggle('on',x.dataset.p===fpos);});
  frender(); };});
document.getElementById('mxSel').onchange=function(){ fmatch=this.value; frender(); };
document.getElementById('mxQ').oninput=function(){ fq=this.value.trim(); frender(); };
var flatReady=false;
function setView(flat){
  document.getElementById('mvCard').classList.toggle('on',!flat);
  document.getElementById('mvFlat').classList.toggle('on',flat);
  document.getElementById('mxF').style.display=flat?'contents':'none';
  wrap.style.display=flat?'none':'';
  document.getElementById('mxFlat').style.display=flat?'':'none';
  if(flat&&!flatReady){ frender(); flatReady=true; }
}
document.getElementById('mvCard').onclick=function(){ setView(false); };
document.getElementById('mvFlat').onclick=function(){ setView(true); };
})();
</script><footer>仅用于内战娱乐 · 数据来自对局战绩</footer></main><script>(function(){var d={};function pf(u){if(!u||d[u])return;d[u]=1;var l=document.createElement('link');l.rel='prefetch';l.href=u;document.head.appendChild(l);}function h(e){var a=e.target.closest&&e.target.closest('a[href]');if(a&&a.origin===location.origin&&a.href!==location.href)pf(a.href);}document.addEventListener('mouseover',h,{passive:true});document.addEventListener('touchstart',h,{passive:true});})();</script></body></html>
