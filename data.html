          if(g['对位经济差']!=null){ ged+=g['对位经济差']; gedn++; } } });
      var dk=Object.keys(days);
      out.push({'姓名':n,'进统计':'是','档位':o['档位'],
        '参战位置':Object.keys(pos).sort(function(a,b){return pos[b]-pos[a];}).join('、'),
        '平均分值':S/gs.length,'大场数':dk.length,'大场胜场':dk.filter(function(d){return days[d];}).length,
        '小场数':gs.length,'小场胜场':W,'MVP次数':M,
        '场均击杀':K/gs.length,'场均死亡':DD/gs.length,'场均助攻':A/gs.length,'KDA':(K+A)/Math.max(1,DD),
        '分均伤害':mins?dmg/mins:null,'伤害转化':gold?dmg/gold*1000:null,'分均经济':mins?gold/mins:null,
        '分均补刀':mins?cs/mins:null,'分均视野':mins?vis/mins:null,
        '输出占比':advN?op/advN:null,'承伤占比':advN?tp/advN:null,'参团率':advN?kp/advN:null,
        '对位输出差':vsn?vsd/vsn:null,'对位经济差':gedn?ged/gedn:null});
    });
    return out;
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function pct(x){ return x==null?'–':Math.round(x*100)+'%'; }

  var OC=[
    {l:'#',h:function(r,i){return '<span class="dim">'+(i+1)+'</span>';}},

    {l:'比赛',v:function(r){return r['大场数']?r['大场胜场']/r['大场数']:-1;},h:function(r){

    {l:'对局',v:function(r){return r['小场数']?r['小场胜场']/r['小场数']:-1;},h:function(r){

  var OC_ADV=[
    {l:'分均伤害',v:function(r){return r['分均伤害'];},h:function(r){return r['分均伤害']==null?'<span class="dim">–</span>':'<b>'+wan(Math.round(r['分均伤害']))+'</b>';}},

    {l:'参团率',v:function(r){return r['参团率'];},h:function(r){return pct(r['参团率']);}},
    {l:'分均经济',v:function(r){return r['分均经济'];},h:function(r){return r['分均经济']==null?'<span class="dim">–</span>':wan(Math.round(r['分均经济']));}},

  function rows(){ return rng==='all'?D.overview.filter(function(r){return r['进统计']==='是';}):rangeOverview(); }

    th.querySelectorAll('th').forEach(function(el){ el.onclick=function(){

  }
  document.getElementById('rAll').onclick=function(){ rng='all'; sortK=null; rsync(); };

  function rsync(){ document.getElementById('rAll').classList.toggle('on',rng==='all');
    document.getElementById('rLcu').classList.toggle('on',rng!=='all'); render(); }
  render();
})();
